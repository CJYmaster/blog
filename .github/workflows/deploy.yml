# 把博客发布到 GitHub Pages
#
# 触发方式：
#   - 推送到 main 分支
#   - 在仓库的 Actions 页面手动点一次（Run workflow）
#
# 这个项目零依赖，所以不需要 npm install，直接跑构建脚本即可。

name: 部署博客到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 需要这些权限才能发布 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 生成静态站点
        run: node build.mjs

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 dist 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
